name: ci

# Push-time CI: run the test suite, ruff, and vulture on every push to
# main and every PR, across Linux/Windows/macOS and Python 3.11/3.12.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: pip install -e '.[test]' pytest
      - name: Run tests
        run: python -m pytest tests -q
      - name: Ruff
        run: ruff check
      # No vulture whitelist/config in the repo yet — run it as an
      # advisory check so its findings don't gate merges.
      - name: Vulture (advisory)
        continue-on-error: true
        run: vulture raidwatch tests
