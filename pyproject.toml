[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"

[project]
name = "raidwatch"
version = "0.9.7"
description = "Defense-side search & seizure verification toolkit: baseline inventory, warrant-profile rescan, post-raid diff, seized-list verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["forensics", "dfir", "seizure", "verification", "baseline"]
dependencies = []

[project.scripts]
raidwatch = "raidwatch.cli:main"

[project.optional-dependencies]
test = [
  "ruff==0.16.*",
  "vulture>=2.11",
]

[tool.ruff.lint]
# ruff 0.16 widened its implicit default rule set; keep the classic
# default (pycodestyle E4/E7/E9 + pyflakes F) that this repo was written against.
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["raidwatch"]
